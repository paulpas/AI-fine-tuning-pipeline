# =============================================================================
# Unified Pipeline Configuration
# =============================================================================
# Single source of truth for the entire LLM training pipeline.
# All stages read from this config - no hardcoded values in scripts.
#
# Usage:
#   python -m pipeline.run --config config/pipeline_config.yaml
#   python -m pipeline.run --config config/pipeline_config.yaml --stage train
#   python -m pipeline.run --config config/my_custom_config.yaml
# =============================================================================

# -----------------------------------------------------------------------------
# Pipeline Metadata
# -----------------------------------------------------------------------------
pipeline:
  name: python-expert
  version: v5
  description: "Python expert model trained on multiple sources"

# -----------------------------------------------------------------------------
# Paths (relative to project root)
# -----------------------------------------------------------------------------
paths:
  root: "."
  repos: "repos"
  data:
    raw: "data/raw"
    training: "data/training"
    combined: "data/training/all_python_combined.json"
    deduped: "data/training/all_python_deduped.json"
  output:
    checkpoints: "finetune/output"
    merged: "finetune/output/merged"
    gguf: "finetune/output/gguf"
  logs: "logs"
  cache: ".cache"

# -----------------------------------------------------------------------------
# Data Sources - Git Repositories
# -----------------------------------------------------------------------------
git_sources:
  - name: k8s-python
    url: https://github.com/kubernetes-client/python
    subdirs: ["examples"]
    type: python
    enabled: true
    description: "Kubernetes Python client official examples"

  - name: pytest
    url: https://github.com/pytest-dev/pytest
    subdirs: ["doc/en"]
    type: rst  # Uses RST extractor
    enabled: true
    description: "Pytest documentation with code examples"

  - name: advanced-python
    url: https://github.com/krother/advanced_python
    subdirs: []  # Entire repo
    type: python
    enabled: true
    description: "Advanced Python programming tutorials"

  - name: python-mastery
    url: https://github.com/dabeaz-course/python-mastery
    subdirs: []
    type: python
    enabled: true
    description: "Python Mastery course materials"

  - name: amazing-python
    url: https://github.com/avinashkranjan/Amazing-Python-Scripts
    subdirs: []
    type: python
    enabled: true
    description: "Collection of useful Python scripts"

  - name: fastapi
    url: https://github.com/tiangolo/fastapi
    subdirs: ["docs_src"]
    type: python
    enabled: true
    description: "FastAPI documentation examples"

  - name: django
    url: https://github.com/django/django
    subdirs: ["tests"]
    type: python
    enabled: true
    description: "Django test examples"

  - name: flask
    url: https://github.com/pallets/flask
    subdirs: ["examples"]
    type: python
    enabled: true
    description: "Flask framework examples"

  - name: requests
    url: https://github.com/psf/requests
    subdirs: ["tests"]
    type: python
    enabled: true
    description: "Requests library examples"

# -----------------------------------------------------------------------------
# Data Sources - Web Crawling
# -----------------------------------------------------------------------------
web_sources:
  - name: hashicorp-terraform
    start_url: https://developer.hashicorp.com/tutorials/library?product=terraform
    allowed_domain: developer.hashicorp.com
    max_depth: 4
    request_delay: 1.0
    enabled: false
    description: "HashiCorp Terraform tutorials and documentation"

  - name: python-docs
    start_url: https://docs.python.org/3/tutorial/
    allowed_domain: docs.python.org
    max_depth: 3
    request_delay: 0.5
    enabled: false
    description: "Official Python documentation tutorials"

