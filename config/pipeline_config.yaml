# -----------------------------------------------------------------------------
# Data Processing Settings
# -----------------------------------------------------------------------------
processing:
  # Extraction
  min_code_length: 50
  max_code_length: 10000
  include_docstrings: true
  include_functions: true
  include_full_files: true

  # Deduplication
  deduplication:
    enabled: true
    min_output_length: 50
    max_repetition: 3
    similarity_threshold: 0.85

  # Dataset format
  output_format: alpaca  # Options: alpaca, sharegpt, raw

  # Validation split
  val_set_size: 0.05

  # Enhanced data generation (NEW)
  enhancement:
    enabled: true
    multi_style: true  # Generate conversational, tutorial, quick-ref versions
    styles:
      - conversational  # Talk like a senior engineer
      - tutorial        # Step-by-step with explanations
      - quick_reference # Concise, just the code
      - debugging       # Error-focused responses
    add_explanations: true
    add_best_practices: true

# -----------------------------------------------------------------------------
# DPO (Preference) Training Settings (NEW)
# -----------------------------------------------------------------------------
dpo_training:
  enabled: true
  output_file: "data/training/dpo_pairs.json"
  categories:
    - exception_handling
    - resource_management
    - security
    - performance
    - kubernetes_patterns
    - docker_patterns
  include_severity:
    - critical
    - high
    - medium

# -----------------------------------------------------------------------------
# Training Configuration
# -----------------------------------------------------------------------------
training:
  # Base model
  base_model: "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
  model_type: "AutoModelForCausalLM"
  tokenizer_type: "AutoTokenizer"
  trust_remote_code: true

  # LoRA configuration
  lora:
    enabled: true
    r: 16
    alpha: 32
    dropout: 0.1
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj

  # Training hyperparameters
  hyperparameters:
    num_epochs: 3
    micro_batch_size: 4
    gradient_accumulation_steps: 2
    learning_rate: 0.00003
    lr_scheduler: cosine
    warmup_ratio: 0.1
    weight_decay: 0.1
    max_grad_norm: 0.5
    optimizer: adamw_torch

  # Sequence settings
  sequence_len: 2048
  sample_packing: false
  pad_to_sequence_len: true

  # Evaluation and checkpointing
  eval_steps: 100
  save_steps: 100
  save_total_limit: 5
  early_stopping_patience: 10

  # Memory optimizations
  gradient_checkpointing: true
  flash_attention: false
  bf16: auto
  fp16: false

  # Hardware
  num_gpus: 4

# -----------------------------------------------------------------------------
# Model Export Configuration
# -----------------------------------------------------------------------------
export:
  # LoRA merge settings
  merge:
    torch_dtype: float16
    device_map: cpu

  # GGUF conversion
  gguf:
    quantization: q4_k_m  # Options: q4_k_m, q5_k_m, q8_0, f16
    llama_cpp_path: "~/llama.cpp"

  # Ollama settings
  ollama:
    model_name: "python-expert"  # Will be suffixed with version
    temperature: 0.5
    repeat_penalty: 1.3
    num_predict: 512
    system_prompt: |
      You are a Python expert assistant. You provide accurate, well-documented
      Python code with clear explanations. You follow best practices and PEP 8
      style guidelines.

# -----------------------------------------------------------------------------
# Logging and Monitoring
# -----------------------------------------------------------------------------
logging:
  level: INFO
  format: "%(asctime)s %(levelname)s %(name)s - %(message)s"
  file: "pipeline.log"
  console: true

# -----------------------------------------------------------------------------
# Profiles (for running multiple configurations)
# -----------------------------------------------------------------------------
profiles:
  # Quick test run
  test:
    training:
      num_epochs: 1
      eval_steps: 10
      save_steps: 10
    git_sources:
      # Only use first 2 sources for testing
      - name: k8s-python
        enabled: true
      - name: pytest
        enabled: true

  # Production run with all sources
  production:
    training:
      num_epochs: 3
      eval_steps: 100
    # All sources enabled by default
