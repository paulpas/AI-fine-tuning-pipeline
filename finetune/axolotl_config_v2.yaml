# Axolotl config for fine-tuning on HashiCorp Terraform dataset
# AMD MI50 GPUs with ROCm
# V2: Improved hyperparameters to reduce repetition

base_model: deepseek-ai/deepseek-coder-6.7b-instruct
model_type: AutoModelForCausalLM
tokenizer_type: AutoTokenizer
trust_remote_code: true

# With 128GB VRAM (4x MI50), load full precision
load_in_8bit: false
load_in_4bit: false

# Dataset
datasets:
  - path: /home/paulpas/git/ideas/llm_training_web_data/data/training/alpaca_deduped.json
    type: alpaca

dataset_prepared_path: /home/paulpas/git/ideas/llm_training_web_data/finetune/prepared_data_v2
val_set_size: 0.1
output_dir: /home/paulpas/git/ideas/llm_training_web_data/finetune/output/terraform-expert-v2

# LoRA configuration - smaller rank for more regularization
adapter: lora
lora_r: 8
lora_alpha: 16
lora_dropout: 0.1
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
lora_target_linear: true

# Training parameters - lower LR, more epochs
sequence_len: 2048
sample_packing: true
pad_to_sequence_len: true

gradient_accumulation_steps: 8
micro_batch_size: 2
num_epochs: 4
learning_rate: 0.00005
lr_scheduler: cosine
warmup_ratio: 0.1

optimizer: adamw_torch
weight_decay: 0.05
max_grad_norm: 0.5

# Precision
bf16: auto
fp16: false
tf32: false

# Logging and evaluation
logging_steps: 10
save_steps: 50
eval_steps: 50
evaluation_strategy: steps
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false

# Checkpointing
save_total_limit: 5
save_strategy: steps

# Performance
gradient_checkpointing: true
flash_attention: false

# Output
hub_model_id:
push_to_hub: false

# Early stopping
early_stopping_patience: 3

# Seed
seed: 42
